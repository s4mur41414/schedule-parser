name: Update Schedule

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 lxml ics

    - name: Run schedule parser
      run: |
        python schedule_to_ical.py
      env:
        MRS_USERNAME: ${{ secrets.MRS_USERNAME }}
        MRS_PASSWORD: ${{ secrets.MRS_PASSWORD }}
        MRS_GROUP: ${{ secrets.MRS_GROUP }}

    - name: Commit and push changes
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add schedule.ics
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Обновление расписания $(date '+%Y-%m-%d %H:%M')"
          git push
        fi
